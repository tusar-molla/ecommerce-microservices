name: CI

   on:
     push:
       branches: [ main ]
       paths-ignore:
         - '**.md'
         - 'docs/**'
     pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one failing service must not hide the others
      matrix:
        service:
          - IdentityService
          - CatalogService
          - OrderService
          - InventoryService
          - PaymentService
          - NotificationService
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ matrix.service }}/${{ matrix.service }}.Api/${{ matrix.service }}.Api.csproj

      # Building the Api project also builds its Application and Infrastructure
      # projects and ECommerce.Contracts
      - name: Build
        run: dotnet build ${{ matrix.service }}/${{ matrix.service }}.Api/${{ matrix.service }}.Api.csproj -c Release --no-restore

  docker:
    name: Docker image ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - IdentityService
          - CatalogService
          - OrderService
          - InventoryService
          - PaymentService
          - NotificationService
    steps:
      - uses: actions/checkout@v4

      # Builds the image only. Nothing is started or published.
      - name: Build image
        run: docker build -f ${{ matrix.service }}/Dockerfile -t ecommerce-ci:${{ matrix.service }} .

